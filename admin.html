{% extends "base.html" %}{% block content %}<section><h1>Admin Dashboard</h1><h2>Users</h2><div class="tablewrap"><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Created</th></tr>{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.created[:10]}}</td></tr>{% endfor %}</table></div><h2>Certificates</h2><div class="tablewrap"><table><tr><th>ID</th><th>User</th><th>Course</th><th>Date</th></tr>{% for c in certs %}<tr><td>{{c.id}}</td><td>{{c.user_id}}</td><td>{{c.course}}</td><td>{{c.issued}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
